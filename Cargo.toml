[workspace]
resolver = "3"
members = ["crates/protocol", "crates/daemon", "crates/frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
plusysmon-protocol = { path = "crates/protocol" }
anyhow = "1.0.104"
futures-util = "0.3.34"
libc = "0.2.191"
nvml-wrapper = "0.13.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = "1.53.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "thin"
strip = true
