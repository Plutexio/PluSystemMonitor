[workspace]
resolver = "3"
members = ["crates/protocol", "crates/daemon", "crates/frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
plusysmon-protocol = { path = "crates/protocol" }
anyhow = "1.0.104"
futures-util = "0.3.34"
libc = "0.2.191"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = "1.53.3"
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "thin"
strip = true
