# Aurora: the default theme and the base every other theme inherits from.
#
# Colours are #rgb, #rrggbb or #rrggbbaa (alpha last, as in CSS).
# A custom theme only needs the keys it changes; everything else comes from
# `extends` (or from Aurora when `extends` is left out).

name = "Aurora"

[colors]
background = "#090b13"
primary = "#8b5cf6"
card = "#ffffff0b"
card_border = "#ffffff14"
card_highlight = "#ffffff0f"
track = "#ffffff12"
grid = "#ffffff0b"
text = "#eceefa"
text_dim = "#8b90b2"
good = "#34d399"
warn = "#fbbf24"
bad = "#f87171"
vignette = "#00000073"

[accents]
cpu = "#8b5cf6"
memory = "#22d3ee"
swap = "#f472b6"
gpu = "#a3e635"
network = "#60a5fa"
disk = "#fb923c"

[shape]
radius = 22
spacing = 16
padding = 22

[effects]
# Drifting colour glows behind the cards.
animated_background = true
background_glow = 0.32
# Neon glow around gauges and graph heads; 0 turns it off.
glow = 0.9
