[package]
name = "plusysmon"
description = "PluSystemMonitor frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plusysmon-protocol.workspace = true
anyhow.workspace = true
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
futures-util.workspace = true
material-colors = "0.5.0"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "macros", "sync"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true

[dev-dependencies]
rcgen.workspace = true

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
