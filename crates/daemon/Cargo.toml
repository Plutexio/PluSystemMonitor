[package]
name = "plusysmond"
description = "PluSystemMonitor daemon: collects system metrics and serves them over WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plusysmon-protocol.workspace = true
anyhow.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "macros", "sync", "signal", "process", "io-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
rcgen.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
nvml-wrapper.workspace = true
toml.workspace = true
# The widget service (see src/widgets.rs). install.sh --daemon-only leaves it out.
plusysmon-client = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

[features]
default = ["widgets"]
widgets = ["dep:plusysmon-client", "dep:serde_json", "dep:zbus"]
